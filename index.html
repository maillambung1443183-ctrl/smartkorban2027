<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>KorbanSmart 2027 - Login</title>
    <style>
        body { font-family: sans-serif; background: #eef2f3; display: flex; justify-content: center; padding: 50px; }
        .box { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box" id="loginBox">
    <h2>Log Masuk</h2>
    <input type="text" id="username" placeholder="Nama Pengguna">
    <input type="password" id="password" placeholder="Kata Laluan">
    <button onclick="login()">Masuk</button>
</div>

<div class="box" id="borangBox" style="display:none;">
    <h2>Borang Pembayaran</h2>
    <form id="borangBayaran">
        <input type="text" name="idPeserta" placeholder="ID Peserta" required>
        <input type="number" name="jumlahBayaran" placeholder="Amaun (RM)" required>
        <button type="submit">Hantar</button>
    </form>
</div>

<script>
    function login() {
        // Logik mudah: Username dan Password mestilah 'admin'
        if(document.getElementById('username').value == "admin" && 
           document.getElementById('password').value == "1234") {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('borangBox').style.display = 'block';
        } else {
            alert("Nama pengguna atau kata laluan salah!");
        }
    }
</script>
</body>
</html>
