<!DOCTYPE html>
<html>
<head>
    <title>KorbanSmart 2027</title>
</head>
<body>

    <input id="nama" placeholder="Nama">
    <input id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="daftar()">DAFTAR</button>

    <script>
        // Pastikan kod ini berada di dalam tag <script> seperti ini
        const url = 'https://script.google.com/macros/s/AKfycbzMgREuHY17c8SFUnUDzBpwkx-YKSHjFqu4d4tkXInD_HaA9b1F7btmTNpGivzpL1I/exec';

        function daftar() {
            let fd = new FormData();
            fd.append('action', 'register');
            fd.append('nama', document.getElementById('nama').value);
            fd.append('email', document.getElementById('email').value);
            fd.append('password', document.getElementById('pass').value);
            
            fetch(url, {method: 'POST', mode: 'no-cors', body: fd})
            .then(() => alert('Data telah dihantar!'));
        }
    </script>
</body>
</html>
