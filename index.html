<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f4f4f9; }
    .page { background: white; padding: 20px; border-radius: 10px; max-width: 400px; margin: auto; }
    input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; box-sizing: border-box; }
    button { width: 100%; padding: 10px; background: #10b981; color: white; border: none; margin-top: 10px; cursor: pointer; }
    .t { display: none; margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px; }
  </style>
</head>
<body>

<div id="authPage" class="page">
  <h2 id="title">Login KorbanSmart</h2>
  <input id="email" placeholder="Email"><input type="password" id="pass" placeholder="Password">
  <button id="mainBtn" onclick="auth('login')">Masuk</button>
  <p style="text-align:center; cursor:pointer; color:blue;" onclick="swap()">Daftar/Login</p>
</div>

<div id="dashPage" class="page" style="display:none">
  <h2>Dashboard</h2>
  <button onclick="tab('k')">Kebaikan</button>
  <button onclick="tab('p')">Pengurus</button>
  <button onclick="tab('s')">Semak Bayaran</button>
  <div id="k" class="t">Kebaikan: Syiar Islam & berkongsi rezeki.</div>
  <div id="p" class="t">Pengurus: En. Awang (011-3333333)</div>
  <div id="s" class="t">Jumlah Terkumpul: <span id="total">RM 0</span></div>
</div>

<script>
  const url = 'https://script.google.com/macros/s/AKfycbwQe_GuUC-xVVUeR_d8OeLQ2ZVb8IfvYjiKEddenCGMBCOt4ssCH2ZP3DcH69Pq8F-JPw/exec';
  let isLogin = true;

  function swap() {
    isLogin = !isLogin;
    document.getElementById('title').innerText = isLogin ? "Login KorbanSmart" : "Daftar Akaun";
    document.getElementById('mainBtn').innerText = isLogin ? "Masuk" : "Daftar";
  }

  function auth(act) {
    let e = document.getElementById('email').value, p = document.getElementById('pass').value;
    fetch(`${url}?action=${isLogin?'login':'register'}&email=${e}&password=${p}`, {method:'POST'})
    .then(r=>r.text()).then(d=>{
      if(d=="Login Berjaya") {
        document.getElementById('authPage').style.display='none';
        document.getElementById('dashPage').style.display='block';
        fetch(`${url}?action=getSummary&email=${e}`).then(r=>r.text()).then(t=>document.getElementById('total').innerText="RM "+t);
      } else alert(d);
    });
  }

  function tab(id) {
    document.querySelectorAll('.t').forEach(e=>e.style.display='none');
    document.getElementById(id).style.display='block';
  }
</script>
</body>
</html>
