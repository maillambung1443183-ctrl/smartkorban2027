<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>KorbanSmart 2027</title>
  <style>
    body { font-family: sans-serif; background: #eef2f3; padding: 20px; }
    .box { background: white; max-width: 400px; margin: auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #2e7d32; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

<div class="box" id="auth">
  <h2>Login Peserta</h2>
  <input type="text" id="id" placeholder="ID Peserta">
  <input type="password" id="pass" placeholder="Password">
  <button onclick="login()">Masuk</button>
  <button onclick="daftar()" style="background:#555;">Daftar Baru</button>
</div>

<div class="box" id="app" style="display:none;">
  <h2>Borang Bayaran</h2>
  <input type="number" id="jumlah" placeholder="Amaun (RM)">
  <button onclick="bayar()">Hantar Bayaran</button>
</div>

<script>
  const URL = "https://script.google.com/macros/s/AKfycbyPEpEILwUAeeV234iEbyKU0b7KgK6hMbNELD0TKqH74Jl3zEH1mb2UrorKbhDSQsfaIQ/exec";
  let currentId = "";

  function login() {
    const id = document.getElementById('id').value;
    const pass = document.getElementById('pass').value;
    fetch(`${URL}?id=${id}&pass=${pass}`)
      .then(res => res.text())
      .then(res => {
        if(res === "LOGIN_BERJAYA") {
          currentId = id;
          document.getElementById('auth').style.display = 'none';
          document.getElementById('app').style.display = 'block';
        } else { alert("Login Gagal!"); }
      });
  }

  function daftar() {
    const id = document.getElementById('id').value;
    const pass = document.getElementById('pass').value;
    fetch(URL, { method: 'POST', body: new URLSearchParams({action: 'daftar', id: id, pass: pass}) })
      .then(() => alert("Daftar Berjaya!"));
  }

  function bayar() {
    const jumlah = document.getElementById('jumlah').value;
    fetch(URL, { method: 'POST', body: new URLSearchParams({action: 'bayar', id: currentId, jumlah: jumlah}) })
      .then(() => alert("Bayaran Berjaya!"));
  }
</script>
</body>
</html>
