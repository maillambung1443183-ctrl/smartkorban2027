<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Sistem Korbansmart 2027</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 20px; background-color: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 5px; }
        .btn-daftar { background-color: #28a745; }
        .btn-loading { background-color: #6c757d; cursor: not-allowed; }
        .link-lupa { color: blue; text-decoration: underline; cursor: pointer; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Pendaftaran Peserta</h2>
        <form id="daftarForm">
            <input type="text" id="nama" placeholder="Nama Penuh" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="text" id="bahagian" placeholder="Bahagian" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" id="btnDaftar" class="btn-daftar">Daftar Sekarang</button>
        </form>
    </div>

    <div class="card">
        <h2>Semak Profil & Baki</h2>
        <input type="email" id="searchEmail" placeholder="Masukkan Email">
        <button onclick="semakData()" style="background-color: #007bff;">Semak Maklumat</button>
        <p class="link-lupa" onclick="lupaPassword()">Lupa kata laluan?</p>
    </div>
    
    <div id="profil" class="card" style="display:none;">
        <h3>Maklumat Pembayaran</h3>
        <p><strong>Nama:</strong> <span id="displayNama"></span></p>
        <p><strong>Jumlah Bayaran:</strong> RM <span id="displayBayaran"></span></p>
        <p><strong>Baki Perlu Dibayar:</strong> RM <span id="displayBaki"></span></p>
        
        <h4>Rekod Bayaran Anda</h4>
        <input type="number" id="amaunBaru" placeholder="Amaun Bayaran (RM)">
        <input type="date" id="tarikhBayaran">
        <input type="text" id="noResit" placeholder="No. Resit / Rujukan">
        <button id="btnUpdate" onclick="updateBayaran()" style="background-color: #007bff;">Simpan Rekod Bayaran</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

        const firebaseConfig = { /* (Kekalkan konfigurasi anda di sini) */ };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const HARGA_PENUH = 800;

        // Fungsi Loading UI
        const setLoading = (btnId, isLoading) => {
            const btn = document.getElementById(btnId);
            if(isLoading) {
                btn.innerText = "Sila tunggu...";
                btn.classList.add('btn-loading');
                btn.disabled = true;
            } else {
                btn.innerText = btnId === 'btnDaftar' ? "Daftar Sekarang" : "Simpan Rekod Bayaran";
                btn.classList.remove('btn-loading');
                btn.disabled = false;
            }
        };

        // FUNGSI DAFTAR
        document.getElementById('daftarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            setLoading('btnDaftar', true);
            try {
                await addDoc(collection(db, "peserta"), {
                    nama: document.getElementById('nama').value,
                    email: document.getElementById('email').value,
                    // ... (fields lain)
                });
                alert("Pendaftaran Berjaya!");
            } catch (e) { alert("Error: " + e.message); }
            setLoading('btnDaftar', false);
        });

        // FUNGSI LUPA PASSWORD
        window.lupaPassword = async () => {
            const email = document.getElementById('searchEmail').value;
            if(!email) { alert("Sila masukkan email pada ruang semakan terlebih dahulu."); return; }
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Pautan set semula kata laluan telah dihantar ke email anda.");
            } catch (e) { alert("Error: " + e.message); }
        };

        // ... (Fungsi updateBayaran dan semakData yang lain)
    </script>
</body>
</html>
