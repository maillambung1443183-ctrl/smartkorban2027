<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>KorbanSmart 2027</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .box { width: 300px; padding: 20px; border: 1px solid #ddd; border-radius: 10px; text-align: center; }
        .hidden { display: none; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; }
        button { width: 100%; padding: 10px; margin-top: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <h2 id="tajukRahsia" onclick="tambahKetik()" style="cursor: pointer;">KorbanSmart 2027</h2>

    <div id="loginForm">
        <input type="email" id="email" placeholder="E-mel">
        <input type="password" id="password" placeholder="Kata Laluan">
        <button onclick="logMasuk()">Log Masuk</button>
        <button onclick="daftarAkaun()">Daftar Akaun Baru</button>
    </div>

    <div id="dashboard" class="hidden">
        <h3>Dashboard Peserta</h3>
        <p>Anda telah log masuk.</p>
        <button onclick="logKeluar()">Log Keluar</button>
    </div>

    <button id="btnAdmin" class="hidden" onclick="bukaPanelAdmin()">Panel Admin</button>
    <div id="panelAdmin" class="hidden">
        <h4>Senarai Peserta:</h4>
        <ul id="listPeserta"></ul>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

    // --- MASUKKAN CONFIG ANDA DI SINI ---
    const firebaseConfig = {
        apiKey: "AIzaSyDqPxa5AkFOI38AJ1mcwDGAgg8UN9JYAb4",
        authDomain: "korbansmart2027.firebaseapp.com",
        projectId: "korbansmart2027",
        storageBucket: "korbansmart2027.firebasestorage.app",
        appId: "1:475740547773:web:0372cdb07699062c4aa5d4",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // LOG MASUK
    window.logMasuk = () => {
        signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value)
        .catch(e => alert(e.message));
    };

    // DAFTAR AKAUN
    window.daftarAkaun = async () => {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        try {
            await createUserWithEmailAndPassword(auth, email, pass);
            await setDoc(doc(db, "users", email), { isAdmin: false });
            alert("Berjaya daftar! Sila log masuk.");
        } catch (e) { alert(e.message); }
    };

    // LOG KELUAR
    window.logKeluar = () => { signOut(auth).then(() => location.reload()); };

    // PANTAU STATUS
    onAuthStateChanged(auth, (user) => {
        if (user) {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
        }
    });

    // RAHSI ADMIN 5 KALI KETIK
    let kira = 0;
    window.tambahKetik = async () => {
        kira++;
        if (kira === 5) {
            const user = auth.currentUser;
            if (user) {
                const snap = await getDoc(doc(db, "users", user.email));
                if (snap.exists() && snap.data().isAdmin) {
                    document.getElementById('btnAdmin').classList.remove('hidden');
                    alert("Admin Mode Aktif!");
                }
            }
            kira = 0;
        }
    };

    // BUKA PANEL ADMIN
    window.bukaPanelAdmin = async () => {
        document.getElementById('panelAdmin').classList.remove('hidden');
        const snap = await getDocs(collection(db, "peserta"));
        let html = "";
        snap.forEach(d => html += `<li>${d.data().nama}</li>`);
        document.getElementById('listPeserta').innerHTML = html;
    };
</script>
</body>
</html>
