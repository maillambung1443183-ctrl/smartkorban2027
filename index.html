<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Sistem Korbansmart 2027</title>
</head>
<body>

    <h2>Pendaftaran Peserta Korban 2027</h2>
    <form id="daftarForm">
        <input type="text" id="nama" placeholder="Nama Penuh" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="bahagian" placeholder="Bahagian" required>
        <input type="password" id="password" placeholder="Password" required>
        <button type="submit">Daftar Sekarang</button>
    </form>

    <hr>

    <h2>Profil & Baki Anda</h2>
    <input type="email" id="searchEmail" placeholder="Masukkan Email">
    <button onclick="semakData()">Semak</button>
    
    <div id="profil" style="margin-top:20px; border:1px solid #ccc; padding:10px; display:none;">
        <p>Nama: <span id="displayNama"></span></p>
        <p>Jumlah Bayaran: RM <span id="displayBayaran"></span></p>
        <p>Baki Perlu Dibayar: RM <span id="displayBaki"></span></p>

        <hr>
        <h4>Kemaskini Bayaran</h4>
        <input type="number" id="jumlahBayaran" placeholder="Amaun Baru">
        <button onclick="updateBayaran()">Simpan Bayaran</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDqPxa5AkFOI38AJ1mcwDGAgg8UN9JYAb4",
            authDomain: "korbansmart2027.firebaseapp.com",
            projectId: "korbansmart2027",
            storageBucket: "korbansmart2027.firebasestorage.app",
            messagingSenderId: "475740547773",
            appId: "1:475740547773:web:0372cdb07699062c4aa5d4",
            measurementId: "G-KW3ML05FC6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const HARGA_PENUH = 800; // Harga 1 bahagian

        // FUNGSI DAFTAR
        document.getElementById('daftarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            try {
                await addDoc(collection(db, "peserta"), {
                    nama: document.getElementById('nama').value,
                    email: document.getElementById('email').value,
                    bahagian: document.getElementById('bahagian').value,
                    password: document.getElementById('password').value,
                    bayaran: 0
                });
                alert("Pendaftaran Berjaya!");
            } catch (e) { alert("Error: " + e.message); }
        });

        // FUNGSI SEMAK
        window.semakData = async () => {
            const email = document.getElementById('searchEmail').value;
            const q = query(collection(db, "peserta"), where("email", "==", email));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) { alert("Data tidak dijumpai!"); return; }

            querySnapshot.forEach((d) => {
                const data = d.data();
                const baki = HARGA_PENUH - data.bayaran;
                document.getElementById('displayNama').innerText = data.nama;
                document.getElementById('displayBayaran').innerText = data.bayaran;
                document.getElementById('displayBaki').innerText = baki;
                document.getElementById('profil').style.display = 'block';
            });
        };

        // FUNGSI KEMASKINI BAYARAN
        window.updateBayaran = async () => {
            const amaunBaru = parseFloat(document.getElementById('jumlahBayaran').value);
            const email = document.getElementById('searchEmail').value;
            
            const q = query(collection(db, "peserta"), where("email", "==", email));
            const querySnapshot = await getDocs(q);
            
            querySnapshot.forEach(async (d) => {
                const dataLama = d.data();
                const totalBayaran = dataLama.bayaran + amaunBaru;
                await updateDoc(doc(db, "peserta", d.id), { bayaran: totalBayaran });
                alert("Bayaran berjaya dikemaskini!");
                semakData(); 
            });
        };
    </script>
</body>
</html>
