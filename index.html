<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Sistem KorbanSmart 2027</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        input { padding: 8px; margin: 5px; width: 250px; }
        button { padding: 10px 20px; cursor: pointer; }
        #btnUpdate { margin-top: 20px; background-color: #28a745; color: white; border: none; }
        #panelAdmin { display: none; padding: 20px; border: 2px solid #28a745; margin-top: 20px; text-align: left; }
    </style>
</head>
<body>

    <h2 id="tajukRahsia" onclick="tambahKetik()" style="cursor: pointer;">KorbanSmart 2027</h2>

    <div id="loginForm">
        <input type="email" id="loginEmail" placeholder="E-mel"><br>
        <input type="password" id="loginPassword" placeholder="Kata Laluan"><br>
        <button id="btnLogin" onclick="logMasuk()">Log Masuk</button>
        <br><br>
        <a href="#" onclick="lupaKataLaluan()" style="color: blue; cursor: pointer;">Lupa kata laluan?</a>
    </div>

    <button id="btnUpdate" style="display: none;" onclick="bukaKemaskini()">Panel Admin (Senarai Peserta)</button>

    <div id="panelAdmin">
        <h3>Senarai Peserta</h3>
        <ul id="senaraiPeserta"></ul>
        <button onclick="document.getElementById('panelAdmin').style.display='none'">Tutup</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        // GANTIKAN DENGAN KONFIGURASI PROJEK ANDA
        const firebaseConfig = {
            apiKey: "AIza...",
            authDomain: "...",
            projectId: "...",
            storageBucket: "...",
            appId: "..."
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Fungsi Log Masuk
        window.logMasuk = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Log masuk berjaya!");
            } catch (error) { alert("Ralat: " + error.message); }
        };

        // Fungsi Lupa Kata Laluan
        window.lupaKataLaluan = async () => {
            const email = document.getElementById('loginEmail').value;
            if (!email) return alert("Sila masukkan e-mel di ruangan atas.");
            try {
                await sendPasswordResetEmail(auth, email);
                alert("E-mel set semula kata laluan telah dihantar ke " + email);
            } catch (error) { alert("Ralat: " + error.message); }
        };

        // Fungsi 5 kali ketik
        let kiraanKetik = 0;
        window.tambahKetik = async () => {
            kiraanKetik++;
            if (kiraanKetik === 5) {
                const user = auth.currentUser;
                if (!user) return alert("Sila log masuk dahulu!");
                
                const userDoc = await getDoc(doc(db, "users", user.email));
                if (userDoc.exists() && userDoc.data().isAdmin === true) {
                    document.getElementById("btnUpdate").style.display = "block";
                    alert("Mod Admin Diaktifkan!");
                } else {
                    alert("Anda bukan admin.");
                }
                kiraanKetik = 0; 
            }
        };

        // Fungsi Buka Panel Admin
        window.bukaKemaskini = async () => {
            const panel = document.getElementById("panelAdmin");
            const senarai = document.getElementById("senaraiPeserta");
            panel.style.display = "block";
            
            const querySnapshot = await getDocs(collection(db, "peserta"));
            senarai.innerHTML = "";
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                senarai.innerHTML += `<li>${data.nama}</li>`;
            });
        };
    </script>
</body>
</html>
