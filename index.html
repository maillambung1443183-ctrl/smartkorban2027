<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Sistem Korbansmart2027</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; }
        .container { border: 1px solid #ccc; padding: 20px; width: 300px; border-radius: 8px; }
        input { width: 100%; margin-bottom: 10px; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; cursor: pointer; background-color: #007bff; color: white; border: none; margin-top: 5px; }
        
        /* Butang Admin disembunyikan secara lalai */
        #btnUpdate { display: none; background-color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h3>Log Masuk KorbanSmart</h3>
    
    <input type="email" id="loginEmail" placeholder="E-mel">
    <input type="password" id="loginPassword" placeholder="Kata Laluan">
    
    <button id="btnLogin" onclick="logMasuk()">Log Masuk</button>
    
    <button id="btnUpdate" onclick="window.location.href='admin_panel.html'">Panel Admin</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

    // TAMBAHKAN CONFIG ANDA DI SINI
    const firebaseConfig = {
        apiKey: "AIzaSyDqPxa5AkFOI38AJ1mcwDGAgg8UN9JYAb4",
        authDomain: "korbansmart2027.firebaseapp.com",
        projectId: "korbansmart2027",
        storageBucket: "korbansmart2027.appspot.com",
        messagingSenderId: "475740547773",
        appId: "1:475740547773:web:0372cdb07699062c4aa5d4",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // FUNGSI LOG MASUK
    window.logMasuk = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        try {
            await signInWithEmailAndPassword(auth, email, password);
            alert("Berjaya log masuk!");
        } catch (error) {
            alert("Ralat: " + error.message);
        }
    };

    // SEMAK STATUS ADMIN
    onAuthStateChanged(auth, async (user) => {
        const btnUpdate = document.getElementById("btnUpdate");
        if (user) {
            try {
                const userDoc = await getDoc(doc(db, "users", user.email));
                if (userDoc.exists() && userDoc.data().isAdmin === true) {
                    btnUpdate.style.display = "block"; // Muncul jika admin
                }
            } catch (e) {
                console.error("Gagal semak admin:", e);
            }
        } else {
            btnUpdate.style.display = "none";
        }
    });
</script>

</body>
</html>
