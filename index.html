<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>KorbanSmart 2027</title>
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #e0e7ff, #f3f4f6); min-height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .card { background: rgba(255, 255, 255, 0.9); padding: 2.5rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-login { background: var(--primary); color: white; }
        .btn-register { background: #10b981; color: white; }
        .hidden { display: none; }
        #panelAdmin { margin-top: 20px; padding: 15px; border-radius: 10px; background: white; text-align: left; }
    </style>
</head>
<body>

    <div class="card" id="mainCard">
        <h2 id="tajukRahsia" onclick="tambahKetik()" style="cursor: pointer;">KorbanSmart 2027</h2>
        
        <div id="loginForm">
            <input type="email" id="loginEmail" placeholder="E-mel">
            <input type="password" id="loginPassword" placeholder="Kata Laluan">
            <button class="btn-login" onclick="logMasuk()">Log Masuk</button>
            <button class="btn-register" onclick="daftarPeserta()">Daftar Sebagai Peserta</button>
            <p style="font-size: 0.8rem; color: #666; cursor: pointer;" onclick="lupaPassword()">Lupa kata laluan?</p>
        </div>

        <div id="dashboardPeserta" class="hidden">
            <h3>Selamat Datang!</h3>
            <input type="text" id="inputNama" placeholder="Nama Penuh Peserta">
            <button class="btn-login" onclick="hantarPendaftaran()">Hantar Pendaftaran</button>
        </div>

        <button id="btnUpdate" class="hidden" onclick="bukaKemaskini()">Panel Admin</button>
        <div id="panelAdmin" class="hidden">
            <h4>Senarai Peserta:</h4>
            <ul id="senaraiPeserta"></ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        // GANTI DATA FIREBASE ANDA DI SINI
        const firebaseConfig = { apiKey: "AIzaSyDqPxa5AkFOI38AJ1mcwDGAgg8UN9JYAb4",
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.logMasuk = async () => {
            try {
                await signInWithEmailAndPassword(auth, document.getElementById('loginEmail').value, document.getElementById('loginPassword').value);
                alert("Log masuk berjaya!");
            } catch (e) { alert(e.message); }
        };

        window.daftarPeserta = async () => {
            const email = document.getElementById('loginEmail').value;
            try {
                await createUserWithEmailAndPassword(auth, email, document.getElementById('loginPassword').value);
                await setDoc(doc(db, "users", email), { isAdmin: false });
                alert("Pendaftaran berjaya!");
            } catch (e) { alert(e.message); }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById("loginForm").classList.add("hidden");
                document.getElementById("dashboardPeserta").classList.remove("hidden");
            }
        });

        let kiraan = 0;
        window.tambahKetik = async () => {
            kiraan++;
            if (kiraan === 5) {
                const user = auth.currentUser;
                if(user) {
                    const snap = await getDoc(doc(db, "users", user.email));
                    if(snap.data()?.isAdmin) {
                        document.getElementById("btnUpdate").classList.remove("hidden");
                        alert("Mod Admin Diaktifkan!");
                    }
                }
                kiraan = 0;
            }
        };

        window.hantarPendaftaran = async () => {
            await addDoc(collection(db, "peserta"), { nama: document.getElementById('inputNama').value });
            alert("Pendaftaran dihantar!");
        };

        window.bukaKemaskini = async () => {
            const panel = document.getElementById("panelAdmin");
            panel.classList.remove("hidden");
            const snap = await getDocs(collection(db, "peserta"));
            let html = "";
            snap.forEach(d => html += `<li>${d.data().nama}</li>`);
            document.getElementById("senaraiPeserta").innerHTML = html;
        };

        window.lupaPassword = async () => {
            await sendPasswordResetEmail(auth, document.getElementById('loginEmail').value);
            alert("E-mel set semula kata laluan telah dihantar.");
        };
    </script>
</body>
</html>
