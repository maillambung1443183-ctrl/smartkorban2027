<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body>

    <input id="nama" placeholder="Nama">
    <input id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    
    <button onclick="prosesDaftar()">DAFTAR</button>

    <script>
        function prosesDaftar() {
            var url = 'https://script.google.com/macros/s/AKfycbxTUnwisHXr1BTuwwvSY7ExeJE7yCxxDEMl1vao-TtB-_SBDvJ-NwVzB_gZtOhIHzA/exec';
            
            var fd = new FormData();
            fd.append('action', 'register');
            fd.append('nama', document.getElementById('nama').value);
            fd.append('email', document.getElementById('email').value);
            fd.append('password', document.getElementById('pass').value);
            
            fetch(url, {method: 'POST', mode: 'no-cors', body: fd})
            .then(function() {
                alert('Data telah dihantar!');
            })
            .catch(function(err) {
                alert('Ralat berlaku: ' + err);
            });
        }
    </script>
</body>
</html>
