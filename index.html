<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KorbanSmart 2027</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 20px; }
        .page { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
        .tab-content { display: none; margin-top: 20px; text-align: center; }
        #dashboardPage { display: none; }
    </style>
</head>
<body>

<div id="loginPage" class="page">
    <h2 style="text-align:center;">Login KorbanSmart</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Masuk</button>
</div>

<div id="dashboardPage" class="page">
    <h2 style="text-align:center;">Dashboard</h2>
    <button onclick="showTab('kebaikan')">Kebaikan Korban</button>
    <button onclick="showTab('pengurus')">Hubungi Pengurus</button>
    <button onclick="showTab('semakan')">Semak Bayaran</button>

    <div id="kebaikan" class="tab-content">
        <h3>Kebaikan Korban</h3>
        <p>Ibadah korban mensucikan harta dan berkongsi rezeki.</p>
    </div>

    <div id="pengurus" class="tab-content">
        <h3>Pengurus Program</h3>
        <p>En. Awang Mohd Fauzi<br>
        <a href="tel:0113333333">011-3333333</a></p>
    </div>

    <div id="semakan" class="tab-content">
        <h3>Jumlah Terkumpul</h3>
        <p id="totalBayaran">RM 0</p>
    </div>
</div>

<script>
    // URL Web App anda
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxoXmlHid3cgQHi_9eVXly_w-Aua7BLoZa-Jq1GyPS14Nb4aoHlRw2y818qnxIz0yfN2A/exec';

    function login() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        fetch(`${scriptURL}?action=login&email=${email}&password=${pass}`, { method: 'POST' })
            .then(res => res.text())
            .then(data => {
                if(data.trim() === "Login Berjaya") {
                    document.getElementById('loginPage').style.display = 'none';
                    document.getElementById('dashboardPage').style.display = 'block';
                    fetchTotal(email);
                } else { alert("Login Gagal!"); }
            });
    }

    function showTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
        document.getElementById(tabId).style.display = 'block';
    }

    function fetchTotal(email) {
        fetch(`${scriptURL}?action=getSummary&email=${email}`)
            .then(res => res.text())
            .then(data => document.getElementById('totalBayaran').innerText = "RM " + data);
    }
</script>
</body>
</html>
