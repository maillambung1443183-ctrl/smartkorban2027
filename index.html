<!-- Bahagian HTML -->
<div id="loginForm" style="margin: 20px; padding: 20px; border: 1px solid #ccc; max-width: 400px; font-family: sans-serif;">
    <h3>Sistem KorbanSmart</h3>
    
    <label>E-mel:</label><br>
    <input type="email" id="loginEmail" placeholder="contoh@gmail.com" style="width: 100%; margin-bottom: 10px; padding: 8px;">
    
    <label>Kata Laluan:</label><br>
    <input type="password" id="loginPassword" placeholder="Kata laluan anda" style="width: 100%; margin-bottom: 10px; padding: 8px;">
    
    <button id="btnLogin" onclick="logMasuk()" style="width: 100%; padding: 10px; cursor: pointer; background-color: #007bff; color: white; border: none;">Log Masuk</button>
    
    <div style="margin-top: 15px; text-align: center;">
        <a href="#" onclick="lupaPassword(); return false;" style="color: blue;">Lupa Kata Laluan?</a>
    </div>
</div>

<!-- Bahagian Script -->
<script type="module">
    // Pastikan import ini dipadam jika anda sudah menggunakan cara lain untuk panggil SDK
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
    
    // Anggap 'auth' sudah diinisialisasi dalam fail Firebase anda
    const auth = getAuth(); 

    // FUNGSI LOG MASUK
    window.logMasuk = async () => {
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        const btn = document.getElementById('btnLogin');

        if (!email || !password) {
            alert("Sila isi e-mel dan kata laluan.");
            return;
        }

        btn.innerText = "Memproses...";
        btn.disabled = true;

        try {
            await signInWithEmailAndPassword(auth, email, password);
            alert("Log masuk berjaya! Selamat datang.");
            // window.location.href = "halaman_utama.html"; // Redirect ke sini
        } catch (error) {
            alert("Ralat: " + error.message);
        } finally {
            btn.innerText = "Log Masuk";
            btn.disabled = false;
        }
    };

    // FUNGSI LUPA KATA LALUAN
    window.lupaPassword = async () => {
        const email = document.getElementById('loginEmail').value;
        if (!email) {
            alert("Sila masukkan e-mel di ruangan e-mel dahulu.");
            return;
        }
        try {
            await sendPasswordResetEmail(auth, email);
            alert("Pautan set semula kata laluan telah dihantar ke e-mel anda.");
        } catch (error) {
            alert("Gagal: " + error.message);
        }
    };
</script>
