<!DOCTYPE html>
<html>
<head><title>KorbanSmart 2027</title></head>
<body>
    <div id="authPage">
        <h2>Daftar/Login</h2>
        <input id="nama" placeholder="Nama">
        <input id="email" placeholder="Email">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="proses('register')">DAFTAR</button>
        <button onclick="proses('login')">LOGIN</button>
    </div>

    <script>
        const url = 'https://script.google.com/macros/s/AKfycbwr_eYXSeMzsJ1B-2bQOP1ovMKUggXZ0-D4V-qwDFzuKw2dfme5eNbUCclz0ASlntwZnA/exec';

        function proses(act) {
            let fd = new FormData();
            fd.append('action', act);
            fd.append('nama', document.getElementById('nama').value);
            fd.append('email', document.getElementById('email').value);
            fd.append('password', document.getElementById('pass').value);
            
            fetch(url, {method: 'POST', mode: 'no-cors', body: fd})
            .then(() => alert('Permintaan dihantar! Sila semak Sheet.'));
        }
    </script>
</body>
</html>
