<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KorbanSmart 2027</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .bg-blue { background: #4f46e5; }
        .bg-green { background: #059669; }
        .bg-red { background: #dc2626; }
        .hidden { display: none; }
        .info { font-size: 0.85rem; color: #444; text-align: left; background: #eef2ff; padding: 10px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="tajuk" onclick="kiraAdmin()" style="cursor: pointer;">KorbanSmart 2027</h2>

        <!-- Bahagian Login -->
        <div id="authDiv">
            <input type="email" id="email" placeholder="E-mel">
            <input type="password" id="pass" placeholder="Kata Laluan">
            <button class="bg-blue" onclick="logMasuk()">Log Masuk</button>
            <button class="bg-green" onclick="daftar()">Daftar</button>
            <p onclick="lupaPass()" style="cursor: pointer; font-size: 12px; color: blue;">Lupa kata laluan?</p>
        </div>

        <!-- Bahagian Dashboard Peserta -->
        <div id="dashDiv" class="hidden">
            <h3>Borang Pendaftaran</h3>
            <input type="text" id="nama" placeholder="Nama Peserta">
            <input type="number" id="jumlah" placeholder="Jumlah Bayaran (RM)">
            <input type="text" id="rujukan" placeholder="No Rujukan Bank">
            
            <div class="info">
                Maybank: <b>551089424735</b><br>
                KRT TAMAN SERI CHINCHIN<br>
                Resit: <b>017-7000242</b>
            </div>

            <button class="bg-green" onclick="hantar()">Hantar Pendaftaran</button>
            <button class="bg-red" onclick="keluar()">Log Keluar</button>
        </div>

        <button id="btnAdmin" class="hidden" onclick="bukaAdmin()">Panel Admin</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        const config = { 
            apiKey: "AIzaSyDqPxa5AkFOI38AJ1mcwDGAgg8UN9JYAb4", 
            authDomain: "korbansmart2027.firebaseapp.com", 
            projectId: "korbansmart2027", 
            storageBucket: "korbansmart2027.firebasestorage.app", 
            appId: "1:475740547773:web:0372cdb07699062c4aa5d4" 
        };
        
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Fungsi Autentikasi
        window.logMasuk = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value).catch(e => alert(e.message));
        window.daftar = async () => { 
            try { 
                await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value); 
                await setDoc(doc(db, "users", document.getElementById('email').value), { isAdmin: false }); 
                alert("Berjaya mendaftar! Sila log masuk."); 
            } catch(e) { alert(e.message); } 
        };
        window.lupaPass = () => sendPasswordResetEmail(auth, document.getElementById('email').value).then(() => alert("Pautan set semula kata laluan telah dihantar ke e-mel!"));
        window.keluar = () => signOut(auth).then(() => location.reload());
        
        // Fungsi Hantar Pendaftaran
        window.hantar = async () => {
            const nama = document.getElementById('nama').value;
            const jumlah = document.getElementById('jumlah').value;
            const rujukan = document.getElementById('rujukan').value;

            if(!nama || !jumlah || !rujukan) { alert("Sila isi semua maklumat!"); return; }

            await addDoc(collection(db, "peserta"), { 
                nama: nama,
                jumlahBayar: jumlah,
                rujukan: rujukan,
                tarikh: new Date().toLocaleDateString()
            });
            alert("Pendaftaran berjaya! Sila WhatsApp resit kepada Admin di 017-7000242.");
            location.reload();
        };

        // Tukar Paparan
        onAuthStateChanged(auth, (user) => { 
            if(user) { 
                document.getElementById('authDiv').classList.add('hidden'); 
                document.getElementById('dashDiv').classList.remove('hidden'); 
            } 
        });

        // Fungsi Admin (Klik 5 kali pada tajuk untuk buka)
        let klik = 0;
        window.kiraAdmin = async () => { 
            klik++; 
            if(klik === 5) { 
                const u = auth.currentUser; 
                if(u) { 
                    const s = await getDoc(doc(db, "users", u.email)); 
                    if(s.exists() && s.data().isAdmin) document.getElementById('btnAdmin').classList.remove('hidden'); 
                } 
                klik = 0; 
            } 
        };
        
        window.bukaAdmin = async () => { 
            const snap = await getDocs(collection(db, "peserta")); 
            let list = "Senarai Peserta:\n\n"; 
            snap.forEach(d => list += d.data().nama + " | RM" + d.data().jumlahBayar + " | Ref: " + d.data().rujukan + "\n"); 
            alert(list); 
        };
    </script>
</body>
</html>
