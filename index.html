<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KorbanSmart 2027</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; padding: 20px; }
        .page { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #059669; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<div id="authPage" class="page">
    <h2 style="text-align:center;">KorbanSmart 2027</h2>
    <input id="email" placeholder="Email"><input type="password" id="pass" placeholder="Password">
    <button onclick="auth('login')">MASUK</button>
    <p onclick="auth('register')" style="text-align:center; color:blue; cursor:pointer;">Daftar Baru</p>
</div>

<div id="dashPage" class="page" style="display:none;">
    <p>BSN: Surau Al Falah TSCC - 0410041000169514</p>
    <hr>
    <input id="bahagian" placeholder="Bilangan Bahagian">
    <input id="jumlah" placeholder="Jumlah Bayaran (RM)">
    <input id="tarikh" type="date">
    <input id="rujukan" placeholder="No Rujukan Bank">
    <input id="resit" placeholder="Link Gambar Resit">
    <button onclick="tambah()" style="background:orange;">HANTAR REKOD</button>
    <pre id="history" style="font-size:12px;"></pre>
</div>

<script>
    const url = 'https://script.google.com/macros/s/AKfycbzM0Iu3h5-JWWxzfmimiylZmkk7oNY4ZP8csZTnUMTXdVyCcaThfYQjhtlO55_WL0mNvw/exec';
    
    function auth(act) {
        let fd = new FormData();
        fd.append('action', act);
        fd.append('email', document.getElementById('email').value);
        fd.append('password', document.getElementById('pass').value);
        fetch(url, {method:'POST', body:fd}).then(r=>r.text()).then(d=>{
            if(d=="Login Berjaya") {
                document.getElementById('authPage').style.display='none';
                document.getElementById('dashPage').style.display='block';
                load();
            } else alert(d);
        });
    }

    function tambah() {
        let fd = new FormData();
        fd.append('action', 'bayar');
        fd.append('email', document.getElementById('email').value);
        fd.append('bahagian', document.getElementById('bahagian').value);
        fd.append('jumlah', document.getElementById('jumlah').value);
        fd.append('tarikh', document.getElementById('tarikh').value);
        fd.append('rujukan', document.getElementById('rujukan').value);
        fd.append('resit', document.getElementById('resit').value);
        
        fetch(url, {method:'POST', body:fd}).then(r=>r.text()).then(d=>{ alert(d); load(); });
    }

    function load() {
        let fd = new FormData();
        fd.append('action', 'getData');
        fd.append('email', document.getElementById('email').value);
        fetch(url, {method:'POST', body:fd}).then(r=>r.json()).then(d=>document.getElementById('history').innerText=d.history);
    }
</script>
</body>
</html>
