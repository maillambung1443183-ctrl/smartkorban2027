<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KorbanSmart 2027</title>
    <style>
        :root { --primary: #059669; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; padding: 20px; }
        .page { max-width: 400px; margin: 40px auto; padding: 25px; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #e2e8f0; border-radius: 12px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; }
        .tab-content { display: none; padding: 20px 0; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; background: white; padding: 15px 0; border-top: 1px solid #eee; }
        .nav-btn { flex: 1; text-align: center; cursor: pointer; color: var(--primary); font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

<div id="authPage" class="page">
    <h2 id="title" style="color:var(--primary); text-align:center;">KorbanSmart 2027</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="pass" placeholder="Password">
    <button id="mainBtn" onclick="auth()">MASUK</button>
    <p style="text-align:center; font-size:14px; margin-top:15px; cursor:pointer;" onclick="swap()">Tukar Daftar/Login</p>
    <p style="text-align:center; font-size:12px; color:red; cursor:pointer;" onclick="resetPass()">Lupa Password?</p>
</div>

<div id="dashPage" class="page" style="display:none;">
    <h2 style="text-align:center;">Dashboard</h2>
    <div style="background:#f0fdf4; padding:20px; border-radius:15px; text-align:center;">
        <h3>Jumlah Terkumpul</h3>
        <h1 id="total" style="color:var(--primary);">RM 0</h1>
    </div>

    <div id="k" class="tab-content" style="display:block;">
        <h3>Info Korban</h3>
        <p>Harga: <b>RM 800</b> (1 bahagian). Ansuran diterima.</p>
        <p style="background:#e0f2fe; padding:10px; border-radius:8px;">BSN: Surau Al Falah TSCC<br><b>0410041000169514</b></p>
    </div>

    <div id="s" class="tab-content">
        <h3>Sejarah Bayaran</h3>
        <pre id="history" style="font-size:12px;"></pre>
    </div>

    <div class="nav-bar">
        <div class="nav-btn" onclick="tab('k')">INFO</div>
        <div class="nav-btn" onclick="tab('s')">REKOD</div>
    </div>
</div>

<script>
    const url = 'https://script.google.com/macros/s/AKfycbxi44QuWqoJNtVDZ725PZi3ysBfh3pbGpI6bB4ugokuMq2vHaPerZeN3T3A0_eUMf8IWA/exec';
    let isLogin = true;

    function swap() {
        isLogin = !isLogin;
        document.getElementById('title').innerText = isLogin ? "KorbanSmart 2027" : "Daftar Akaun";
        document.getElementById('mainBtn').innerText = isLogin ? "MASUK" : "DAFTAR";
    }

    function auth() {
        const btn = document.getElementById('mainBtn');
        btn.innerText = "Sila tunggu...";
        let e = document.getElementById('email').value, p = document.getElementById('pass').value;
        fetch(`${url}?action=${isLogin?'login':'register'}&email=${e}&password=${p}`, {method:'POST'})
        .then(r=>r.text()).then(d=>{
            btn.innerText = isLogin ? "MASUK" : "DAFTAR";
            if(d.trim() == "Login Berjaya") {
                document.getElementById('authPage').style.display='none';
                document.getElementById('dashPage').style.display='block';
                fetch(`${url}?action=getSummary&email=${e}`).then(r=>r.text()).then(t=>document.getElementById('total').innerText="RM "+t);
                fetch(`${url}?action=getHistory&email=${e}`).then(r=>r.text()).then(t=>document.getElementById('history').innerText=t);
            } else { alert(d); }
        });
    }

    function resetPass() {
        let e = document.getElementById('email').value;
        if(!e) { alert("Masukkan email!"); return; }
        fetch(`${url}?action=reset&email=${e}`, {method:'POST'}).then(r=>r.text()).then(d=>alert(d));
    }

    function tab(id) {
        document.querySelectorAll('.tab-content').forEach(e=>e.style.display='none');
        document.getElementById(id).style.display='block';
    }
</script>
</body>
</html>
