<!DOCTYPE html>
<html>
<body>
  <form id="myForm">
    <input type="text" id="nama" placeholder="Nama Penuh" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="bahagian" placeholder="Bahagian" required>
    <input type="password" id="password" placeholder="Password" required>
    <button type="submit">Daftar</button>
  </form>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDqPxa5AkFOI38AJ1mcwDGAgg8UN9JYAb4",
      authDomain: "korbansmart2027.firebaseapp.com",
      projectId: "korbansmart2027",
      storageBucket: "korbansmart2027.firebasestorage.app",
      messagingSenderId: "475740547773",
      appId: "1:475740547773:web:0372cdb07699062c4aa5d4",
      measurementId: "G-KW3ML05FC6"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('myForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        await addDoc(collection(db, "peserta"), {
          nama: document.getElementById('nama').value,
          email: document.getElementById('email').value,
          bahagian: document.getElementById('bahagian').value,
          password: document.getElementById('password').value,
          bayaran: 0,
          baki: 0
        });
        alert("Pendaftaran Berjaya disimpan ke Firestore!");
      } catch (e) {
        alert("Error: " + e.message);
      }
    });
  </script>
</body>
</html>
