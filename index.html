<script type="module">
    // 1. Import library yang betul (JANGAN tambah library lain)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, doc } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";
    import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

    // 2. Konfigurasi
    const firebaseConfig = {
        apiKey: "AIzaSyDqPxa5AkFOI38AJ1mcwDGAgg8UN9JYAb4",
        authDomain: "korbansmart2027.firebaseapp.com",
        projectId: "korbansmart2027",
        storageBucket: "korbansmart2027.firebasestorage.app",
        messagingSenderId: "475740547773",
        appId: "1:475740547773:web:0372cdb07699062c4aa5d4",
        measurementId: "G-KW3ML05FC6"
    };

    // 3. Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const HARGA_PENUH = 800;

    // 4. Pastikan fungsi boleh diakses oleh HTML (Gunakan 'window.')
    window.semakData = async () => {
        const email = document.getElementById('searchEmail').value;
        if(!email) { alert("Masukkan email"); return; }
        
        const q = query(collection(db, "peserta"), where("email", "==", email));
        const querySnapshot = await getDocs(q);
        
        if (querySnapshot.empty) { alert("Data tidak dijumpai!"); return; }

        querySnapshot.forEach((d) => {
            const data = d.data();
            document.getElementById('displayNama').innerText = data.nama;
            document.getElementById('displayBayaran').innerText = data.bayaran;
            document.getElementById('displayBaki').innerText = HARGA_PENUH - data.bayaran;
            document.getElementById('profil').style.display = 'block';
        });
    };

    window.lupaPassword = async () => {
        const email = document.getElementById('searchEmail').value;
        if(!email) { alert("Masukkan email dahulu."); return; }
        try {
            await sendPasswordResetEmail(auth, email);
            alert("Pautan set semula kata laluan telah dihantar ke email anda.");
        } catch (e) { alert(e.message); }
    };

    window.updateBayaran = async () => {
        const amaun = parseFloat(document.getElementById('amaunBaru').value);
        const email = document.getElementById('searchEmail').value;
        const q = query(collection(db, "peserta"), where("email", "==", email));
        const querySnapshot = await getDocs(q);
        
        querySnapshot.forEach(async (d) => {
            await updateDoc(doc(db, "peserta", d.id), { bayaran: d.data().bayaran + amaun });
            alert("Berjaya dikemaskini!");
            window.semakData();
        });
    };
    
    // Pendaftaran
    document.getElementById('daftarForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        await addDoc(collection(db, "peserta"), {
            nama: document.getElementById('nama').value,
            email: document.getElementById('email').value,
            bayaran: 0
        });
        alert("Daftar berjaya!");
    });
</script>
