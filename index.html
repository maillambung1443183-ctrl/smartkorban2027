<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>Sistem KorbanSmart 2027</title>
</head>
<body>

    <div id="loginForm" style="margin: 20px; padding: 20px; border: 1px solid #ccc; max-width: 400px; font-family: sans-serif;">
        <h3>Sistem KorbanSmart</h3>
        
        <label>E-mel:</label><br>
        <input type="email" id="loginEmail" placeholder="contoh@gmail.com" style="width: 100%; margin-bottom: 10px; padding: 8px;">
        
        <label>Kata Laluan:</label><br>
        <input type="password" id="loginPassword" placeholder="Kata laluan anda" style="width: 100%; margin-bottom: 10px; padding: 8px;">
        
        <button id="btnLogin" onclick="logMasuk()" style="width: 100%; padding: 10px; cursor: pointer; background-color: #007bff; color: white; border: none;">Log Masuk</button>
        
        <div style="margin-top: 15px; text-align: center;">
            <a href="#" onclick="lupaPassword(); return false;" style="color: blue;">Lupa Kata Laluan?</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";

        // GANTIKAN DENGAN CONFIG SEBENAR DARI FIREBASE CONSOLE ANDA
        const firebaseConfig = {
            apiKey: "ISI_API_KEY_ANDA_DI_SINI",
            authDomain: "korbansmart2027.firebaseapp.com",
            projectId: "korbansmart2027",
            storageBucket: "korbansmart2027.appspot.com",
            messagingSenderId: "ISI_ID_ANDA",
            appId: "ISI_APP_ID_ANDA"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // FUNGSI LOG MASUK
        window.logMasuk = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLogin');

            try {
                btn.innerText = "Memproses...";
                await signInWithEmailAndPassword(auth, email, password);
                alert("Log masuk berjaya!");
            } catch (error) {
                alert("Ralat: " + error.message);
            } finally {
                btn.innerText = "Log Masuk";
            }
        };

        // FUNGSI LUPA KATA LALUAN
        window.lupaPassword = async () => {
            const email = document.getElementById('loginEmail').value;
            if (!email) { alert("Sila masukkan e-mel dahulu."); return; }
            
            try {
                await sendPasswordResetEmail(auth, email);
                alert("Pautan set semula kata laluan telah dihantar ke e-mel anda.");
            } catch (error) {
                alert("Ralat: " + error.message);
            }
        };
    </script>
</body>
</html>
