<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KorbanSmart 2027</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f3; display: flex; justify-content: center; padding: 20px; }
        form { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { color: #10b981; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

<form id="borangBayaran">
    <h2>KorbanSmart 2027</h2>
    <input type="text" name="idPeserta" placeholder="ID Peserta" required>
    <input type="number" name="jumlahBayaran" placeholder="Amaun (RM)" required>
    <input type="date" name="tarikhBankIn" required>
    <input type="text" name="noRujukan" placeholder="No Rujukan Bank" required>
    <button type="submit" id="btnHantar">Hantar Pembayaran</button>
</form>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzMkZqZJw6UDBLyVbEcgm2_waMfFR94hQNRoaOmaKtaACF_4TSS5cmL7lTqyiCCTQbF1w/exec';
    const form = document.getElementById('borangBayaran');
    const btn = document.getElementById('btnHantar');

    form.addEventListener('submit', e => {
        e.preventDefault();
        btn.innerHTML = "Sedang menghantar...";
        
        fetch(scriptURL, { 
            method: 'POST', 
            body: new FormData(form),
            mode: 'no-cors' 
        })
        .then(() => {
            alert('Pembayaran berjaya direkodkan!');
            btn.innerHTML = "Hantar Pembayaran";
            form.reset();
        })
        .catch(error => {
            alert('Ralat! Sila cuba lagi.');
            btn.innerHTML = "Hantar Pembayaran";
        });
    });
</script>
</body>
</html>
