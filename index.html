<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <title>KorbanSmart 2027</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        .dash-style { background: linear-gradient(135deg, #e0f2f1, #ffffff); padding: 20px; border-radius: 15px; border: 1px solid #b2dfdb; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 5px; cursor: pointer; color: white; font-weight: bold; }
        .bg-blue { background: #4f46e5; }
        .bg-green { background: #059669; }
        .bg-red { background: #dc2626; }
        .hidden { display: none; }
        .info { font-size: 0.85rem; color: #444; text-align: left; background: #eef2ff; padding: 10px; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="tajuk" onclick="kiraAdmin()" style="cursor: pointer;">KorbanSmart 2027</h2>

        <div id="authDiv">
            <input type="email" id="email" placeholder="E-mel">
            <input type="password" id="pass" placeholder="Kata Laluan">
            <button class="bg-blue" onclick="logMasuk()">Log Masuk</button>
            <button class="bg-green" onclick="daftar()">Daftar</button>
            <p onclick="lupaPass()" style="cursor: pointer; font-size: 12px; color: blue; text-decoration: underline;">Lupa kata laluan?</p>
        </div>

        <div id="borangDiv" class="hidden dash-style">
            <h3>Butiran Pendaftaran</h3>
            <input type="text" id="nama" placeholder="Nama Penuh">
            <select id="bahagian">
                <option value="1">1 Bahagian (RM 800)</option>
                <option value="2">2 Bahagian (RM 1600)</option>
            </select>
            <button class="bg-blue" onclick="keBayaran()">Seterusnya (Pembayaran)</button>
        </div>

        <div id="bayarDiv" class="hidden dash-style">
            <h3>Maklumat Pembayaran</h3>
            <div class="info">
                Maybank: <b>551089424735</b><br>
                KRT TAMAN SERI CHINCHIN
            </div>
            <input type="number" id="jumlah" placeholder="Jumlah Bayaran (RM)">
            <input type="text" id="rujukan" placeholder="No Rujukan Bank (Ref)">
            <button class="bg-green" onclick="hantarSemua()">Hantar Resit ke Admin</button>
            <button class="bg-red" onclick="keluar()">Log Keluar</button>
        </div>

        <button id="btnAdmin" class="hidden" onclick="bukaAdmin()">Panel Admin</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-firestore.js";

        const config = { apiKey: "AIzaSyDqPxa5AkFOI38AJ1mcwDGAgg8UN9JYAb4", authDomain: "korbansmart2027.firebaseapp.com", projectId: "korbansmart2027", storageBucket: "korbansmart2027.firebasestorage.app", appId: "1:475740547773:web:0372cdb07699062c4aa5d4" };
        const app = initializeApp(config);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // State untuk simpan data sementara
        let tempUser = {};

        window.logMasuk = () => signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value).catch(e => alert(e.message));
        window.daftar = async () => {
            try { await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value); await setDoc(doc(db, "users", document.getElementById('email').value), { isAdmin: false }); alert("Berjaya daftar!"); } catch(e) { alert(e.message); }
        };
        window.lupaPass = () => sendPasswordResetEmail(auth, document.getElementById('email').value).then(() => alert("Email dihantar!"));
        window.keluar = () => signOut(auth).then(() => location.reload());

        window.keBayaran = () => {
            tempUser.nama = document.getElementById('nama').value;
            tempUser.bahagian = document.getElementById('bahagian').value;
            document.getElementById('borangDiv').classList.add('hidden');
            document.getElementById('bayarDiv').classList.remove('hidden');
        };

        window.hantarSemua = async () => {
            await addDoc(collection(db, "peserta"), {
                nama: tempUser.nama,
                bahagian: tempUser.bahagian,
                jumlah: document.getElementById('jumlah').value,
                rujukan: document.getElementById('rujukan').value,
                tarikh: new Date().toLocaleDateString()
            });
            alert("Pendaftaran berjaya! Sila hantar resit ke WhatsApp 017-7000242.");
            location.reload();
        };

        onAuthStateChanged(auth, (user) => {
            if(user) {
                document.getElementById('authDiv').classList.add('hidden');
                document.getElementById('borangDiv').classList.remove('hidden');
            }
        });

        window.kiraAdmin = async () => { /* Logik Admin sama */ };
        window.bukaAdmin = async () => { /* Logik Admin sama */ };
    </script>
</body>
</html>
